# Copy this file to config.toml and edit. Every key is optional; anything you
# leave out falls back to the default shown here.

[intent]
# How a spoken phrase becomes a button press.
#
# "fuzzy"  - offline string matching plus the synonym table in aliases.py.
#            Free, instant, no API key, no VRAM beyond Whisper.
# "gemini" - Google Gemini. Free tier, needs GEMINI_API_KEY.
# "claude" - the Anthropic API. Paid, needs ANTHROPIC_API_KEY.
backend = "fuzzy"

# Who to ask when the offline matcher cannot settle an utterance:
# "none", "gemini" or "claude".
#
# This is the useful setting. Most commands are unambiguous - "roger",
# "connect the jetway", "intercom" - and resolve offline at full confidence,
# with nothing sent anywhere. Only the awkward ones travel: "super, moze byc",
# "ok dzieki", phrasings no alias covers yet. That is a handful of requests
# per flight rather than one per command, which keeps it inside a free tier.
#
# Escalation needs a key - set it in the [gemini] section further down.
escalate_to = "none"

[audio]
# Push-to-talk key for the BRIDGE. Keep it separate from SLC's own PTT key
# (SLC defaults to LeftCtrl) so the two never fight over the same press.
# Any pynput key name works: f13, f14, scroll_lock, alt_r, ctrl_r, pause...
ptt_key = "f13"

# Substring of the input device name; empty string = Windows default.
# Run  python -m slcvoiceai --list-devices  to see the options.
# Do not leave this empty if you have virtual devices: "Steam Streaming
# Microphone" and friends often steal the default slot and record silence.
input_device = ""

sample_rate = 16000
max_seconds = 20.0
min_seconds = 0.35      # ignore accidental taps of the PTT key

[stt]
# "auto" measures free VRAM at startup and picks a model that fits. The
# bridge shares the card with the simulator, and the simulator wins - on a
# 16 GB card MSFS 2024 routinely holds 15 GB, which left large-v3 in float16
# fighting for scraps and turning 2-second transcriptions into 92-second ones.
#
# What auto picks, by free VRAM:
#
#   >= 3600 MB   large-v3   1.61s/command  best at translating Polish
#   >= 2200 MB   medium     1.25s          noticeably looser translation
#   >= 1100 MB   small      0.96s          translates non-English literally
#   >=  700 MB   base       0.40s          weaker still
#    <  700 MB   base on the CPU - a starved GPU is slower than a free CPU
#
# Free VRAM is read when the bridge starts, so start it after the simulator
# for the choice to reflect a real flight. Check with:
#
#   python -m slcvoiceai --check-hardware
#
# Naming a model here overrides all of that - an explicit choice is a
# decision, not a suggestion.
model = "auto"
device = "auto"          # "auto", "cuda" or "cpu"
compute_type = "auto"    # "auto", "int8" or "float16"

task = "translate"

# "" = autodetect the spoken language (recommended). Force it to "pl" if
# autodetect keeps guessing wrong.
language = ""

# 1 = greedy decoding. Measured on real speech with MSFS running: beam_size 5
# took 6.00s where 1 took 1.17s, for byte-identical output. Command phrases
# are short and unambiguous; the wider search buys nothing here.
beam_size = 1

[llm]
# Only used when [intent] backend = "claude".
model = "claude-haiku-4-5"

# Paste your key here, or leave empty to use the environment variable.
api_key = ""
api_key_env = "ANTHROPIC_API_KEY"
max_tokens = 512
timeout_seconds = 20.0

[gemini]
# Only used when backend or escalate_to is "gemini".
# gemini-3.1-flash-lite is the recommended free-tier model and is plenty for
# picking one button off a short list.
model = "gemini-3.1-flash-lite"
fallback_model = "gemini-3.1-flash-lite"

# Paste your key between the quotes. Free one: https://aistudio.google.com/apikey
# config.toml is in .gitignore so this stays out of any repository - but strip
# it before sharing the file with anyone.
# Leave empty to use the GEMINI_API_KEY environment variable instead.
api_key = ""
api_key_env = "GEMINI_API_KEY"
max_tokens = 512
timeout_seconds = 20.0

[slc]
process_name = "SLC.exe"

# Optional. In SLC: Settings -> Export Stream Data, point it at a folder, tick
# the fields you care about (flight phase especially), then put that folder
# here. Gives the "claude" backend context about where in the flight you are;
# the "fuzzy" backend ignores it.
stream_export_dir = ""

[behaviour]
# Below this confidence the bridge does nothing rather than guess.
#
# Fuzzy matching always finds a *nearest* neighbour, so this floor is what
# stops radio chatter from landing on a cabin command. Tuned against real
# Whisper output plus a set of things pilots say that are not SLC commands:
# 0.50-0.70 separates them cleanly, so 0.65 sits mid-band. See
# tests/test_intent.py, which locks both directions in.
#
# Raise it if you get misfires, lower it if genuine commands get ignored -
# the log prints the score of every near miss, so tune from real numbers.
# On backend = "claude" this can go lower (~0.55); that model reports
# calibrated confidence and declines on its own.
min_confidence = 0.65

# Refuse to act on a command that took longer than this to transcribe. If the
# GPU stalls, a decoded command can be a minute old by the time it lands, and
# pressing a button for something you said a minute ago is worse than missing
# it. 0 disables the check.
max_command_age_seconds = 12.0

# Start reading SLC's buttons the moment the push-to-talk key goes down,
# instead of waiting until you let go.
#
# Reading SLC's window takes around two seconds and was the slowest part of a
# command. It does not depend on what you are about to say, though, so it can
# run while you are still saying it - which hides it behind your own speech
# and takes it out of the wait altogether. Turn this off if you would rather
# the button list were read strictly after you stop talking.
prescan = true

# How old that scan may be when it is finally used. It starts with the key, so
# its age is however long you held the key plus transcription. Past this the
# bridge reads SLC again rather than press something that was on offer half a
# minute ago. 0 disables the check.
max_scan_age_seconds = 30.0

# true = decide and log, but never actually press anything. Start here.
dry_run = false

log_file = "slcvoiceai.log"
