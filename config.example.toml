# Copy this file to config.toml and edit. Every key is optional; anything you
# leave out falls back to the default shown here.

[intent]
# How a spoken phrase gets matched to an SLC button.
#
# "fuzzy"  - offline string matching. Free, instant, no API key, and no VRAM
#            beyond Whisper itself - which matters when the GPU is already
#            busy running the simulator. Works well for phrases close to the
#            button's own wording.
# "claude" - the Anthropic API. Much better at loose and indirect phrasing
#            ("tell them we're good to push"), at roughly a third of a grosz
#            per command. Needs credit on console.anthropic.com.
backend = "fuzzy"

[audio]
# Push-to-talk key for the BRIDGE. Keep it separate from SLC's own PTT key
# (SLC defaults to LeftCtrl) so the two never fight over the same press.
# Any pynput key name works: f13, f14, scroll_lock, alt_r, ctrl_r, pause...
ptt_key = "f13"

# Substring of the input device name; empty string = Windows default.
# Run  python -m slcvoiceai --list-devices  to see the options.
# Do not leave this empty if you have virtual devices: "Steam Streaming
# Microphone" and friends often steal the default slot and record silence.
input_device = ""

sample_rate = 16000
max_seconds = 20.0
min_seconds = 0.35      # ignore accidental taps of the PTT key

[stt]
# faster-whisper model and quantisation. Measured on Polish speech with MSFS
# running and the GPU at 92%, translating "polacz mnie z obsluga naziemna":
#
#   large-v3  int8      1897 MB  1.61s  "Connect me with ground service."
#   large-v3  float16   2777 MB  1.40s  "Connect me with ground service."
#   medium    int8      1070 MB  1.25s  "Join me with a ground service."
#   small     float16   ~500 MB  0.44s  "Connect me with the service to the earth"
#
# small is quick but translates Polish literally, which is why speaking
# English to it feels better. large-v3 at int8 keeps the good translation and
# uses a third less memory than float16 - and memory, not speed, is what
# caused 90-second stalls when the simulator had the card. Drop to "medium"
# if yours is tighter still.
model = "large-v3"
device = "cuda"          # "cpu" works but is markedly slower here
compute_type = "int8"    # "float16" if you have VRAM to spare

# "translate" makes Whisper emit English no matter what you speak - this is
# what lets you talk Polish to a program whose buttons are all in English.
# Change to "transcribe" only if you already speak English to it.
task = "translate"

# "" = autodetect the spoken language (recommended). Force it to "pl" if
# autodetect keeps guessing wrong.
language = ""

# 1 = greedy decoding. Measured on real speech with MSFS running: beam_size 5
# took 6.00s where 1 took 1.17s, for byte-identical output. Command phrases
# are short and unambiguous; the wider search buys nothing here.
beam_size = 1

[llm]
# Only used when [intent] backend = "claude".
model = "claude-haiku-4-5"
api_key_env = "ANTHROPIC_API_KEY"
max_tokens = 512
timeout_seconds = 20.0

[slc]
process_name = "SLC.exe"

# Optional. In SLC: Settings -> Export Stream Data, point it at a folder, tick
# the fields you care about (flight phase especially), then put that folder
# here. Gives the "claude" backend context about where in the flight you are;
# the "fuzzy" backend ignores it.
stream_export_dir = ""

[behaviour]
# Below this confidence the bridge does nothing rather than guess.
#
# Fuzzy matching always finds a *nearest* neighbour, so this floor is what
# stops radio chatter from landing on a cabin command. Tuned against real
# Whisper output plus a set of things pilots say that are not SLC commands:
# 0.50-0.70 separates them cleanly, so 0.65 sits mid-band. See
# tests/test_intent.py, which locks both directions in.
#
# Raise it if you get misfires, lower it if genuine commands get ignored -
# the log prints the score of every near miss, so tune from real numbers.
# On backend = "claude" this can go lower (~0.55); that model reports
# calibrated confidence and declines on its own.
min_confidence = 0.65

# Refuse to act on a command that took longer than this to transcribe. If the
# GPU stalls, a decoded command can be a minute old by the time it lands, and
# pressing a button for something you said a minute ago is worse than missing
# it. 0 disables the check.
max_command_age_seconds = 12.0

# true = decide and log, but never actually press anything. Start here.
dry_run = false

log_file = "slcvoiceai.log"
