# Copy this file to config.toml and edit. Every key is optional; anything you
# leave out falls back to the default shown here.

[intent]
# How a spoken phrase becomes a button press.
#
# "fuzzy"  - offline string matching plus the synonym table in aliases.py.
#            Free, instant, no API key, no VRAM beyond Whisper.
# "gemini" - Google Gemini. Free tier, needs GEMINI_API_KEY.
# "claude" - the Anthropic API. Paid, needs ANTHROPIC_API_KEY.
backend = "fuzzy"

# Who to ask when the offline matcher cannot settle an utterance:
# "none", "gemini" or "claude".
#
# This is the useful setting. Most commands are unambiguous - "roger",
# "connect the jetway", "intercom" - and resolve offline at full confidence,
# with nothing sent anywhere. Only the awkward ones travel: "super, moze byc",
# "ok dzieki", phrasings no alias covers yet. That is a handful of requests
# per flight rather than one per command, which keeps it inside a free tier.
#
# Escalation needs a key - set it in the [gemini] section further down.
escalate_to = "none"

# And when to spend that round trip, which costs about three seconds.
#
#   "ties"   - only when two buttons score level, or when a match scraped in
#              on margin alone.
#   "always" - also when nothing on screen came close.
#
# Measured over 128 escalations in real flights: on a tie the cloud answered
# differently 19 times out of 73, which is what it is for. On "nothing came
# close" it ran 51 times, refused 38 of them, and what is left after the
# furniture and alias work is two useful saves - for two and a half minutes
# of waiting spread across the flight. When nothing on screen resembles what
# you said, the bridge now tells you so at once, and names the button that is
# missing along with the key you have bound to reach it.
escalate_when = "ties"

[audio]
# Push-to-talk key for the BRIDGE. Keep it separate from SLC's own PTT key
# (SLC defaults to LeftCtrl) so the two never fight over the same press.
# Any pynput key name works: f13, f14, scroll_lock, alt_r, ctrl_r, pause...
ptt_key = "f13"

# Substring of the input device name; empty string = Windows default.
# Run  python -m slcvoiceai --list-devices  to see the options.
# Do not leave this empty if you have virtual devices: "Steam Streaming
# Microphone" and friends often steal the default slot and record silence.
input_device = ""

sample_rate = 16000
max_seconds = 20.0
min_seconds = 0.35      # ignore accidental taps of the PTT key

[stt]
# "auto" measures free VRAM at startup and picks a model that fits. The
# bridge shares the card with the simulator, and the simulator wins - on a
# 16 GB card MSFS 2024 routinely holds 15 GB, which left large-v3 in float16
# fighting for scraps and turning 2-second transcriptions into 92-second ones.
#
# What auto picks, by free VRAM:
#
#   >= 3600 MB   large-v3   1.61s/command  best at translating Polish
#   >= 2200 MB   medium     1.25s          noticeably looser translation
#   >= 1100 MB   small      0.96s          translates non-English literally
#   >=  700 MB   base       0.40s          weaker still
#    <  700 MB   base on the CPU - a starved GPU is slower than a free CPU
#
# Free VRAM is read when you press Start listening, not when the panel opens,
# and neither order of starting is free: switch listening on first and MSFS
# takes the VRAM back from a model already resident; switch it on afterwards
# and there is nothing left, so auto drops to base on the CPU. That happened
# on 2026-09-23 with 451 MB free, and since the task below is "translate",
# the weakest translator in the table is the worst possible outcome:
# "mozecie tankowac" arrived as "can you pass the bus to tank?".
#
# So name a model here instead. An explicit choice is a decision, not a
# suggestion: it is not re-read and not downgraded. "medium" is the sensible
# default on a card with room; "small" on a smaller one. Check what auto
# would pick with:
#
#   python -m slcvoiceai --check-hardware
# Where the speech is decoded.
#
#   "local" - faster-whisper on this machine. Free, works without a network,
#             and shares the graphics card with the simulator, which is the
#             whole difficulty above.
#   "groq"  - send the clip away and get whisper-large-v3 every time, whatever
#             MSFS is holding. Needs a key and a connection; see [groq] below.
#
# Everything from `model` to `compute_type` is the local path only.
backend = "local"

model = "auto"
device = "auto"          # "auto", "cuda" or "cpu"
compute_type = "auto"    # "auto", "int8" or "float16"

# "translate" makes Whisper turn what you said into English before anything
# else sees it. SLC's buttons are English, so that looked like the obvious
# choice - but it puts a lossy step in front of every command, and the larger
# the model the better it hides how lossy. On a small model it is brutal:
# "mozecie tankowac" came back as "can you pass the bus to tank?".
#
# "transcribe" keeps your own words, and aliases.py now carries the Polish to
# match them - the same thing BlueLine Realism does with its Polish pack.
# Worth knowing: on "transcribe" the button names themselves stop helping,
# because "GSX, START REFUELLING" shares no letters with anything you say, so
# every match comes from the alias table. If you speak English, leave this on
# "translate" - it costs nothing and the button names do the work.
task = "translate"

# "" = autodetect the spoken language (recommended). Force it to "pl" if
# autodetect keeps guessing wrong.
language = ""

# 1 = greedy decoding. Measured on real speech with MSFS running: beam_size 5
# took 6.00s where 1 took 1.17s, for byte-identical output. Command phrases
# are short and unambiguous; the wider search buys nothing here.
beam_size = 1

[llm]
# Only used when [intent] backend = "claude".
model = "claude-haiku-4-5"

# Paste your key here, or leave empty to use the environment variable.
api_key = ""
api_key_env = "ANTHROPIC_API_KEY"
max_tokens = 512
timeout_seconds = 20.0

[groq]
# Only used when [stt] backend = "groq". Free key: https://console.groq.com/keys
#
# It fits inside the free tier with room to spare. Measured on a Krakow-Rome
# flight: 75 clips, 147 seconds of speech in total. Groq bills a minimum of
# ten seconds per request, so that is 750 seconds against a daily allowance of
# 28,800 - about three per cent, or thirty-eight such flights a day. The
# per-minute limit is 20 requests; the busiest minute of that flight was six.
#
# whisper-large-v3-turbo transcribes and nothing else, which is what the
# Polish half of aliases.py wants. Use whisper-large-v3 if you want Groq to
# translate instead, i.e. with [stt] task = "translate".
model = "whisper-large-v3-turbo"

api_key = ""
api_key_env = "GROQ_API_KEY"

timeout_seconds = 15.0
slow_seconds = 6.0

# A local model to fall back on when Groq cannot be reached - "small" costs
# 464 MB on disk and keeps a dropped connection from costing you the flight.
# Empty means no fallback: the command fails and says so in the panel, which
# is at least not silent.
fallback_model = ""

[gemini]
# Only used when backend or escalate_to is "gemini".
# gemini-3.1-flash-lite is the recommended free-tier model and is plenty for
# picking one button off a short list.
model = "gemini-3.1-flash-lite"

# Used on 429 and 503, and it has to be a DIFFERENT model than the one
# above - naming the same one asks whatever just failed to try again.
# This shipped pointing at itself and cost nothing until 2026-09-24, when
# every flash-lite model answered 503 "high demand" and the retry was
# useless. A heavier flash model is the point: it is the one still
# answering when the light one is swamped.
fallback_model = "gemini-3.6-flash"

# Paste your key between the quotes. Free one: https://aistudio.google.com/apikey
# config.toml is in .gitignore so this stays out of any repository - but strip
# it before sharing the file with anyone.
# Leave empty to use the GEMINI_API_KEY environment variable instead.
api_key = ""
api_key_env = "GEMINI_API_KEY"
max_tokens = 512
timeout_seconds = 20.0

[slc]
process_name = "SLC.exe"

# Optional, but it does more than it used to. In SLC: Settings -> Export Stream
# Data, point it at a folder, tick the fields you care about, then put that
# folder here.
#
# Two things use it. It gives the "claude" backend context about where in the
# flight you are, which the "fuzzy" backend ignores. And it is the only way the
# bridge can tell whether a flight is in progress at all - which decides whether
# 'Start New Passenger Flight' is offered.
#
# SLC leaves those start-a-flight buttons on the toolbar for the whole flight,
# a few icons along from the seatbelt sign, and pressing one ends the flight.
# With this unset the bridge cannot tell a flight from the launcher, so it keeps
# them hidden either way: you can always start a flight with the mouse, but you
# cannot un-end one. Tick at least flightStatus, flightNumber or the airport
# codes and they come back at the launcher.
stream_export_dir = ""

[behaviour]
# Below this confidence the bridge does nothing rather than guess.
#
# Fuzzy matching always finds a *nearest* neighbour, so this floor is what
# stops radio chatter from landing on a cabin command. Tuned against real
# Whisper output plus a set of things pilots say that are not SLC commands:
# 0.50-0.70 separates them cleanly, so 0.65 sits mid-band. See
# tests/test_intent.py, which locks both directions in.
#
# Raise it if you get misfires, lower it if genuine commands get ignored -
# the log prints the score of every near miss, so tune from real numbers.
# On backend = "claude" this can go lower (~0.55); that model reports
# calibrated confidence and declines on its own.
min_confidence = 0.65

# Refuse to act on a command that took longer than this to transcribe. If the
# GPU stalls, a decoded command can be a minute old by the time it lands, and
# pressing a button for something you said a minute ago is worse than missing
# it. 0 disables the check.
max_command_age_seconds = 12.0

# Start reading SLC's buttons the moment the push-to-talk key goes down,
# instead of waiting until you let go.
#
# Reading SLC's window takes around two seconds and was the slowest part of a
# command. It does not depend on what you are about to say, though, so it can
# run while you are still saying it - which hides it behind your own speech
# and takes it out of the wait altogether. Turn this off if you would rather
# the button list were read strictly after you stop talking.
prescan = true

# How old that scan may be when it is finally used. It starts with the key, so
# its age is however long you held the key plus transcription. Past this the
# bridge reads SLC again rather than press something that was on offer half a
# minute ago. 0 disables the check.
max_scan_age_seconds = 30.0

# Ask GitHub once at startup whether a newer version has been pushed, and say
# so in the panel and the log. Nothing downloads or replaces itself either way
# - updating stays something you do on purpose.
#
# The check reads one file over HTTPS and sends nothing about your machine. It
# reads the version straight off the default branch, so a version counts as
# available the moment it is pushed. Set false if you would rather it never
# touched the network.
check_for_updates = true

# true = decide and log, but never actually press anything. Start here.
dry_run = false

# Start listening by itself once SLC appears, so the panel can be left open
# and forgotten. There is a tick box for this at the top of the panel.
#
# The panel has to be running to notice - nothing here launches it - and it
# sits idle with no speech model loaded until SLC actually shows up. Note
# that this means Whisper loads AFTER the simulator, which is when the
# graphics card has least to spare; if commands start taking many seconds,
# that is why, and starting the panel first is the cure.
start_with_slc = false

log_file = "slcvoiceai.log"

[ui]
# Language for the control panel: "auto", "en" or "pl".
#
# "auto" follows your Windows display language and falls back to English.
# You can also change it from the picker in the panel, which takes effect
# straight away.
#
# Only the interface is translated. The log stays in English on purpose: the
# panel colours entries by matching on them, tools/replay_log.py parses them
# to replay a flight against a newer build, and a log you send someone for
# help is far more useful in a language they read. Adding a language means
# copying one block in slcvoiceai/i18n.py and translating it - anything you
# miss falls back to English rather than breaking.
language = "auto"

[hotkeys]
# Three calls, straight from the keyboard, with no speaking involved.
#
# An Airbus rings the cabin and the ground crew from ATT and MECH on the
# overhead. SLC answers both, but MSFS does not reliably pass ATT through,
# so the cabin call is the one that sticks. These do the same job from the
# keyboard, whatever the aircraft.
#
# What each one presses is fixed. Only the keys are yours:
#
#   intercom  call the cabin crew        (the ATT button)
#   ground    call the ground crew       (the MECH button)
#   pa        announcement to passengers
#   back      back out of whichever menu is open
#
# Nothing is bound by default. Uncomment what you want, or set it in the
# panel, which writes it back here for you.
#
#   intercom = "ctrl+q"
#   ground   = "ctrl+w"
#   pa       = "ctrl+e"
#   back     = "ctrl+r"
#
# Use a COMBINATION rather than a bare key. MSFS already has a binding for
# nearly every single key, so ctrl+q is far likelier to be free than q.
#
# Modifiers: ctrl, alt, shift, cmd (also spelled win, super or meta). Left
# and right count as the same modifier, so ctrl+q fires on either Ctrl.
# The key itself is a single character, or a name: insert, delete, home,
# end, page_up, page_down, scroll_lock, pause, f1-f20, num_lock, menu,
# tab, esc, space, backspace, up, down, left, right.
#
# One binding covers backing out of all three menus. SLC lays out three BACK
# buttons at once, but only one of them is on top at any moment, and the
# bridge asks Windows which - so the key always presses the one you can see.
