<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SLCVoiceAI</title>
<link rel="stylesheet" href="panel.css">
</head>
<body>

<!--
  Every user-visible word here carries a data-i18n* attribute rather than
  a sentence. gui.py reads this file, collects those keys, and hands the
  page a phrase for each one in the pilot's language; switching language
  re-sends the same dictionary. Nothing in this file is translated, which
  is what makes adding a language a matter of editing i18n.py alone.

  The activity feed is the deliberate exception - see panel.js.
-->

<header class="titlebar">
  <!-- A headset, because that is what this program is: the pilot talking
       to the cabin. The mic tip is the same green the status card turns
       while listening. -->
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path class="band" d="M5 11.8V9.4a7 7 0 0 1 14 0v2.4"/>
        <rect class="ear" x="2.6" y="9.4" width="4.8" height="7.7" rx="2.4"/>
        <rect class="ear" x="16.6" y="9.4" width="4.8" height="7.7" rx="2.4"/>
        <path class="boom" d="M19 17.3v1.1a2.7 2.7 0 0 1-2.7 2.7h-4.2"/>
        <circle class="mic" cx="11.3" cy="21.1" r="1.7"/>
      </svg>
    </span>
    <span class="wordmark">SLC<b>Voice</b>AI</span>
  </div>

  <!-- Not the script buymeacoffee.com hands out: that one is 60px tall,
       arrives over the network, and calls document.write - which blanks
       a page that has finished parsing. This is the same button, drawn
       here, opening the same page in the real browser. -->
  <button class="coffee" id="coffee" data-i18n-title="coffee.title">
    <svg class="mug" viewBox="0 0 24 24" aria-hidden="true">
      <path class="steam" d="M7.2 5.6c-1-1.1.5-2 0-3.1M11 5.6c-1-1.1.5-2 0-3.1M14.8 5.6c-1-1.1.5-2 0-3.1"/>
      <path class="pot" d="M3.4 8.6h12.2v6.6a5 5 0 0 1-5 5h-2.2a5 5 0 0 1-5-5z"/>
      <path class="handle" d="M15.9 10.4h2a2.8 2.8 0 0 1 0 5.6h-2"/>
    </svg>
    <span data-i18n="coffee.text"></span>
  </button>

  <!-- Language sits here rather than among the controls: it is set once
       and then never touched, unlike the things in the Controls card,
       which are tuned during a flight. -->
  <div class="titlebar-right">
    <!-- Hovering the version says who wrote this and where it lives. The
         card is a child of the anchor so that reaching down to the link
         still counts as hovering; the stylesheet bridges the few pixels
         in between, which the mouse would otherwise cross with nothing
         under it. -->
    <div class="about-anchor">
      <span class="version" id="version" tabindex="0"></span>
      <div class="about" role="tooltip">
        <span class="author" data-i18n="about.author"></span>
        <button class="about-link" id="about-repo"></button>
      </div>
    </div>
    <select id="lang" class="lang-select" data-i18n-title="control.language"></select>
  </div>
</header>

<div class="update" id="update" hidden>
  <span aria-hidden="true">&#8593;</span>
  <span id="update-text"></span>
  <span class="go" data-i18n="update.open"></span>
</div>

<!-- Between the name and the status, because between them they decide
     whether the pilot ever has to look at the status card at all. -->
<div class="autostart">
  <label>
    <input type="checkbox" id="auto-launch">
    <span class="autostart-text">
      <span data-i18n="control.auto_launch"></span>
      <small data-i18n="control.auto_launch_hint"></small>
    </span>
  </label>
  <label>
    <input type="checkbox" id="auto">
    <span class="autostart-text">
      <span data-i18n="control.auto_start"></span>
      <small data-i18n="control.auto_start_hint"></small>
    </span>
  </label>
</div>

<main class="body">

  <section class="card" id="status-card">
    <h2 data-i18n="card.status"></h2>
    <div class="status-row">
      <span class="dot" aria-hidden="true"></span>
      <span class="status-text" id="status-text"></span>
    </div>
    <div class="subtitle" id="subtitle"></div>
    <button class="primary" id="toggle">
      <svg class="glyph" id="toggle-glyph" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      <span id="toggle-text"></span>
    </button>
  </section>

  <section class="card">
    <h2 data-i18n="card.controls"></h2>

    <label class="row check">
      <input type="checkbox" id="dry">
      <span data-i18n="control.dry_run"></span>
    </label>

    <div class="row">
      <span class="label" data-i18n="control.confidence"></span>
      <span class="spacer"></span>
      <span class="readout" id="conf-out"></span>
    </div>
    <div class="slider-row">
      <input type="range" id="conf" min="0.30" max="0.95" step="0.01">
    </div>
    <p class="hint" data-i18n="control.hint"></p>
  </section>

  <section class="card">
    <h2 data-i18n="card.hotkeys"></h2>
    <!-- The three rows are built by panel.js from what gui.py sends: the
         calls are fixed, so the page never invents one. -->
    <div class="hotkeys" id="hotkeys"></div>
  </section>

  <section class="card">
    <h2 data-i18n="card.test"></h2>
    <div class="test-row">
      <input class="text-input" id="phrase" autocomplete="off" spellcheck="false"
             data-i18n-placeholder="test.placeholder">
      <button class="ghost" id="match" data-i18n="test.match"></button>
    </div>
    <p class="hint" data-i18n="test.hint"></p>
  </section>

  <section class="card feed-card">
    <h2>
      <span data-i18n="pane.activity"></span>
      <button class="icon-btn" id="clear" data-i18n-title="feed.clear">&#9003;</button>
    </h2>
    <div class="feed" id="feed"></div>
  </section>

</main>

<script src="panel.js"></script>
</body>
</html>
